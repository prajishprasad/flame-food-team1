{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <h1>Pick a cafe</h1>
    <p>Browse campus spots and build your order.</p>
</div>

<div class="card-grid">
    {% for cafe in cafes %}
        <a class="card cafe-card" href="{{ url_for('show_cafe', name=cafe) }}">
            <h3>{{ cafe }}</h3>
            <p>{{ cafes[cafe]|length }} items on the menu</p>
        </a>
    {% endfor %}
</div>
{% endblock %}
