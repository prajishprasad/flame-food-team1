<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FLAME Food{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #faf7f2;
            --surface: #ffffff;
            --text: #1c1917;
            --muted: #78716c;
            --border: #e7e5e4;
            --accent: #ea580c;
            --accent-dark: #c2410c;
            --accent-soft: #ffedd5;
            --success: #15803d;
            --success-soft: #dcfce7;
            --shadow: 0 4px 24px rgba(28, 25, 23, 0.06);
            --radius: 14px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "DM Sans", system-ui, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top right, rgba(234, 88, 12, 0.08), transparent 28%),
                var(--bg);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .navbar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: -0.02em;
        }

        .brand-mark {
            display: grid;
            place-items: center;
            width: 2.2rem;
            height: 2.2rem;
            border-radius: 0.75rem;
            background: linear-gradient(135deg, var(--accent), #f97316);
            color: white;
            font-size: 1rem;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .nav-link {
            padding: 0.55rem 0.9rem;
            border-radius: 999px;
            color: var(--muted);
            font-weight: 500;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .nav-link:hover,
        .nav-link.active {
            background: var(--accent-soft);
            color: var(--accent-dark);
        }

        .cart-link {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 1.4rem;
            height: 1.4rem;
            padding: 0 0.35rem;
            border-radius: 999px;
            background: var(--accent);
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .page {
            width: min(920px, calc(100% - 2rem));
            margin: 2rem auto 3rem;
        }

        .page-header {
            margin-bottom: 1.5rem;
        }

        .page-header h1,
        .page-header h2 {
            margin: 0 0 0.35rem;
            font-size: clamp(1.6rem, 4vw, 2rem);
            letter-spacing: -0.03em;
        }

        .page-header p {
            margin: 0;
            color: var(--muted);
            font-size: 1rem;
        }

        .flash {
            margin-bottom: 1.25rem;
            padding: 0.9rem 1rem;
            border-radius: var(--radius);
            background: var(--success-soft);
            color: var(--success);
            border: 1px solid #bbf7d0;
            font-weight: 600;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
        }

        .card,
        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .cafe-card {
            padding: 1.25rem;
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
        }

        .cafe-card:hover {
            transform: translateY(-2px);
            border-color: #fdba74;
            box-shadow: 0 10px 30px rgba(234, 88, 12, 0.12);
        }

        .cafe-card h3 {
            margin: 0 0 0.35rem;
            font-size: 1.15rem;
        }

        .cafe-card p {
            margin: 0;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .menu-list,
        .item-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            gap: 0.75rem;
        }

        .menu-item,
        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 1rem 1.1rem;
        }

        .menu-item-info h3,
        .cart-item-info h3 {
            margin: 0 0 0.2rem;
            font-size: 1rem;
        }

        .menu-item-info p,
        .cart-item-info p {
            margin: 0;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            padding: 0.65rem 1rem;
            border: none;
            border-radius: 999px;
            background: var(--accent);
            color: white;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.15s ease;
            white-space: nowrap;
        }

        .btn:hover {
            background: var(--accent-dark);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: white;
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: #fafaf9;
            color: var(--text);
        }

        .actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }

        .empty-state {
            padding: 2.5rem 1.5rem;
            text-align: center;
        }

        .empty-state h3 {
            margin: 0 0 0.5rem;
        }

        .empty-state p {
            margin: 0 0 1.25rem;
            color: var(--muted);
        }

        .order-card {
            padding: 1.1rem 1.2rem 1.2rem;
            margin-bottom: 1rem;
        }

        .order-card:last-child {
            margin-bottom: 0;
        }

        .order-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 0.85rem;
            padding-bottom: 0.85rem;
            border-bottom: 1px solid var(--border);
        }

        .order-card-header h3 {
            margin: 0;
            font-size: 1rem;
        }

        .order-pill {
            padding: 0.25rem 0.65rem;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent-dark);
            font-size: 0.78rem;
            font-weight: 700;
        }

        .order-items {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            gap: 0.55rem;
        }

        .order-items li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .order-items strong {
            color: var(--text);
        }

        @media (max-width: 640px) {
            .navbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .menu-item,
            .cart-item {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a class="brand" href="{{ url_for('home') }}">
            <span class="brand-mark">🔥</span>
            <span>FLAME Food</span>
        </a>
        <div class="nav-links">
            <a class="nav-link{% if request.endpoint == 'home' %} active{% endif %}" href="{{ url_for('home') }}">Home</a>
            <a class="nav-link{% if request.endpoint == 'view_orders' %} active{% endif %}" href="{{ url_for('view_orders') }}">Orders</a>
            <a class="nav-link cart-link{% if request.endpoint == 'view_cart' %} active{% endif %}" href="{{ url_for('view_cart') }}">
                Cart
                <span class="badge">{{ cart_count }}</span>
            </a>
        </div>
    </nav>

    <main class="page">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash">{{ messages[0] }}</div>
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
